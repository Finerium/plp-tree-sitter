
<!doctype HTML>
<head>
  <title>Tree-sitter Highlighting</title>
  <style>
    body {
      font-family: monospace
    }
    .attribute { font-style: italic;color: #af0000; }
    .comment { font-style: italic;color: #8a8a8a; }
    .constant { color: #875f00; }
    .constant.builtin { font-weight: bold;color: #d75f00; }
    .constructor { color: #af8700; }
    .function { color: #005fd7; }
    .function.builtin { font-weight: bold;color: #005fd7; }
    .keyword { color: #5f00d7; }
    .module { color: #af8700; }
    .number { font-weight: bold;color: #875f00; }
    .operator { font-weight: bold;color: #4e4e4e; }
    .property { color: #af0000; }
    .property.builtin { font-weight: bold;color: #af0000; }
    .punctuation { color: #4e4e4e; }
    .punctuation.bracket { color: #808080; }
    .punctuation.delimiter { color: #808080; }
    .punctuation.special { color: #4e4e4e; }
    .string { color: #008700; }
    .string.special { color: #008787; }
    .tag { color: #000087; }
    .type { color: #005f5f; }
    .type.builtin { font-weight: bold;color: #005f5f; }
    .variable { color: #d0d0d0; }
    .variable.builtin { font-weight: bold;color: #d0d0d0; }
    .variable.parameter { text-decoration: underline;color: #d0d0d0; }
  </style>

</head>
<body>

<div class="highlight">
<pre><code><span class='property'>status</span> <span class='keyword'>in</span> <span class='punctuation bracket'>(</span><span class='string'>&quot;open&quot;</span><span class='punctuation delimiter'>,</span> <span class='string'>&quot;pending&quot;</span><span class='punctuation bracket'>)</span> <span class='keyword'>and</span> <span class='property'>title</span> <span class='keyword'>contains</span> <span class='string'>&quot;invoice&quot;</span>
  <span class='keyword'>and</span> <span class='punctuation bracket'>(</span><span class='property'>priority</span> <span class='operator'>&gt;=</span> <span class='number'>2</span> <span class='keyword'>or</span> <span class='property'>owner</span> <span class='operator'>=</span> <span class='string'>&quot;budi&quot;</span><span class='punctuation bracket'>)</span> <span class='keyword'>and</span> <span class='keyword'>not</span> <span class='property'>archived</span> <span class='operator'>=</span> <span class='constant builtin'>true</span></code></pre>
</div>
